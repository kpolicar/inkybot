name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 3.2)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      artifact-name: Inkybot-release
      retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: Inkybot-release
          path: release/

      - name: Create zip
        run: cd release && zip -r ../Inkybot_v${{ steps.version.outputs.VERSION }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Inkybot_v*.zip
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.VERSION) || github.ref_name }}

      - name: Upload to host
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: Inkybot_v${{ steps.version.outputs.VERSION }}.zip
          target: ~/

      - name: Deploy to container
        if: vars.DEPLOY_ENABLED == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            ZIP="Inkybot_v${{ steps.version.outputs.VERSION }}.zip"
            docker cp ~/$ZIP inkybot-app:/var/www/html/storage/app/public/$ZIP
            rm ~/$ZIP

      - name: Setup ORAS
        if: vars.PUBLISH_TO_GHCR == 'true'
        uses: oras-project/setup-oras@v1

      - name: Push to GHCR
        if: vars.PUBLISH_TO_GHCR == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }} \
            --artifact-type application/vnd.inkybot.release \
            Inkybot_v${{ steps.version.outputs.VERSION }}.zip:application/zip
