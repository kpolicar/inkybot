name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 3.2)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Restore packages
        run: nuget restore Inkybot.sln

      - name: Copy EasyHook native files
        shell: pwsh
        run: |
          $src = Join-Path $env:USERPROFILE ".nuget\packages\easyhook\2.7.7097\contentFiles\any\net40"
          Copy-Item "$src\*" -Destination Inkybot\ -Force
          Copy-Item "$src\*" -Destination InkybotHook\ -Force

      - name: Build
        run: msbuild Inkybot.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Move obfuscated output
        shell: cmd
        run: |
          if exist Inkybot\bin\Release\confused (
            xcopy /y /e Inkybot\bin\Release\confused\* Inkybot\bin\Release\
            rmdir /s /q Inkybot\bin\Release\confused
          )

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path Inkybot/bin/Release/* -DestinationPath Inkybot_v${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Inkybot_v*.zip
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.VERSION) || github.ref_name }}

      - name: Deploy to host
        if: vars.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}"
          SCP="scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          ZIP="Inkybot_v${{ steps.version.outputs.VERSION }}.zip"
          $SCP "$ZIP" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/$ZIP"
          $SSH "docker cp ~/$ZIP inkybot-app:/var/www/html/storage/app/public/$ZIP && rm ~/$ZIP"
          rm -f ~/.ssh/deploy_key

      - name: Setup ORAS
        if: vars.PUBLISH_TO_GHCR == 'true'
        uses: oras-project/setup-oras@v1

      - name: Push to GHCR
        if: vars.PUBLISH_TO_GHCR == 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }} \
            --artifact-type application/vnd.inkybot.release \
            Inkybot_v${{ steps.version.outputs.VERSION }}.zip:application/zip
