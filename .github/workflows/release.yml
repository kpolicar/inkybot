name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 3.2)'
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Restore packages
        run: nuget restore Inkybot.sln

      - name: Build
        run: msbuild Inkybot.sln /p:Configuration=Release /p:Platform="Any CPU" /m

      - name: Move obfuscated output
        shell: cmd
        run: |
          if exist Inkybot\bin\Release\confused (
            xcopy /y /e Inkybot\bin\Release\confused\* Inkybot\bin\Release\
            rmdir /s /q Inkybot\bin\Release\confused
          )

      - name: Create zip
        shell: pwsh
        run: Compress-Archive -Path Inkybot/bin/Release/* -DestinationPath Inkybot_v${{ steps.version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Inkybot_v*.zip
          generate_release_notes: true
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.version.outputs.VERSION) || github.ref_name }}

      - name: Setup ORAS
        if: vars.PUBLISH_TO_GHCR == 'true'
        uses: oras-project/setup-oras@v1

      - name: Push to GHCR
        if: vars.PUBLISH_TO_GHCR == 'true'
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
          oras push ghcr.io/${{ github.repository }}:${{ steps.version.outputs.VERSION }} \
            --artifact-type application/vnd.inkybot.release \
            Inkybot_v${{ steps.version.outputs.VERSION }}.zip:application/zip
